    <script>
      // Compatibility shim for browser extensions that assign to window.fetch
      try {
        const _origFetch = window.fetch;
        let _currentFetch = _origFetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _currentFetch;
          },
          set(fn) {
            _currentFetch = fn;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (err) {}
      window.addEventListener('error', function(e) {
        if (e && e.message && e.message.includes('fetch of #<Window> which has only a getter')) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
